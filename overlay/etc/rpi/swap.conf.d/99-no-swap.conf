# disable swap entirely. this is a headless appliance with ample RAM for its
# workload, and swap is undesirable here: a disk swapfile wears the sdcard (counter
# to the resilience goal of reducing writes), and trixie's default zram+file
# mechanism keeps a writeback file (/var/swap) that, under the tmpfs overlay root,
# lives in RAM (~150-230MB wasted). zram alone is RAM-backed but unneeded for this
# load -- without swap, memory pressure fails fast (oom) instead of thrashing.
#
# rpi-swap reads this drop-in (see swap.conf(5)); 'none' disables zram and the
# swapfile and removes any existing /var/swap. supersedes the (ineffective)
# dphys-swapfile mask, which targeted the old mechanism trixie no longer uses.
[Main]
Mechanism=none
