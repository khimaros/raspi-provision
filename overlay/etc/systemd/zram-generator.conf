# disable zram entirely (companion to swap.conf.d/99-no-swap.conf, which turns off
# rpi-swap). this overrides the stock /usr/lib/systemd/zram-generator.conf, whose
# [zram0] section would otherwise still create an (unused) /dev/zram0 device even
# with swap off. with no [zram0] section here, systemd-zram-generator creates no
# zram device at all. see zram-generator.conf(5).
