# build portable initramfs images. the stock raspios MODULES=dep resolves the
# currently mounted root device, which fails when the kernel mounted root
# itself without an initramfs (/proc/mounts shows /dev/root, as under the qemu
# test harness): "mkinitramfs: failed to determine device for /". most is the
# debian default and keeps the overlay initramfs bootable across hardware.
MODULES=most
