# do not load the zram module. this overrides the stock
# /usr/lib/modules-load.d/20-zram-generator.conf, which force-loads zram at boot
# and thereby creates an unused /dev/zram0 device even with swap disabled (see
# swap.conf.d/99-no-swap.conf and ../systemd/zram-generator.conf). with no module
# names listed here, systemd-modules-load loads nothing for zram.
